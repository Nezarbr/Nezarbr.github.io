site:
  name: Nezar Boujida
  site: 'https://nezarbr.github.io'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: Nezar Boujida | Data Scientist
    template: '%s — Nezar Boujida'
  description: 'Data Scientist · Machine Learning, Statistics & NLP'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Nezar Boujida
    images:
      - url: '~/assets/images/og-portfolio.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: false

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only'
